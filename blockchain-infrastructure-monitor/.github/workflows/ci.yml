name: Blockchain Monitor CI

on:
  push:
    paths:
      - 'blockchain-infrastructure-monitor/**'
  pull_request:
    paths:
      - 'blockchain-infrastructure-monitor/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain-infrastructure-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile collector.py
