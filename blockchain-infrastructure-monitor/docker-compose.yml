services:
  collector:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python collector.py"
    environment:
      RPC_URL: ${RPC_URL:-https://cloudflare-eth.com}
      POLL_SECONDS: ${POLL_SECONDS:-15}
    ports:
      - "9105:9105"
    volumes:
      - ./:/app:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - collector

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
